<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI助教答疑平台</title>
<style>
:root{--blue-50:#eef6ff;--blue-100:#dbeafe;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;--gray-300:#d1d5db;--gray-500:#6b7280;--gray-700:#374151}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,var(--blue-50) 0%,#f8fbff 50%,var(--blue-100) 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;color:var(--gray-700)}
.card{width:100%;max-width:680px;height:76vh;min-height:520px;background:#fff;border-radius:18px;box-shadow:0 20px 45px rgba(37,99,235,.12);border:1px solid rgba(59,130,246,.08);display:flex;flex-direction:column;overflow:hidden}
.header{text-align:center;padding:24px 24px 18px;border-bottom:1px solid var(--blue-100);background:linear-gradient(180deg,#fff,var(--blue-50))}
.header .logo{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;margin-bottom:10px;border-radius:14px;background:linear-gradient(135deg,var(--blue-500),var(--blue-700));color:#fff;font-size:24px;font-weight:700}
.header h1{font-size:24px;font-weight:700;color:var(--blue-700);margin-bottom:4px}
.header .subtitle{font-size:14px;color:var(--gray-500)}
.chat{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:78%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.6;word-break:break-word}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:#f3f7ff;border:1px solid var(--blue-100);color:var(--gray-700);border-bottom-left-radius:4px}
.bubble .name{display:block;font-size:12px;font-weight:600;margin-bottom:4px;opacity:.85}
.composer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--blue-100);background:#fff}
.composer input{flex:1;height:46px;padding:0 14px;font-size:15px;color:var(--gray-700);background:#f9fbff;border:1px solid var(--gray-300);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.composer input::placeholder{color:#9ca3af}
.composer input:focus{border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.composer button{height:46px;padding:0 24px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:filter .2s,transform .1s}
.composer button:hover{filter:brightness(1.06)}
.composer button:active{transform:translateY(1px)}
</style>
</head>
<body>
<main class="card">
<header class="header">
<span class="logo">AI</span>
<h1>AI助教答疑平台</h1>
<p class="subtitle">智能答疑 · 随时提问</p>
</header>
<section class="chat">
<div class="bubble user">
<span class="name">用户</span>
这是第1个问题。
</div>
<div class="bubble ai">
<span class="name">AI助教</span>
AI接口将在第9周接入。
</div>
</section>
<footer class="composer">
<input type="text" placeholder="请输入你的问题…" autofocus>
<button type="button">提问</button>
</footer>
</main>
</body>
</html>
